name: Publish @nimbus-dev/sdk

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance (sigstore signature backed by GitHub OIDC).
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-nimbus-ci

      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build sdk (dist)
        run: bun run --filter @nimbus-dev/sdk build

      - name: Typecheck
        run: bun run --filter @nimbus-dev/sdk typecheck

      - name: Unit tests — sdk
        run: bun test packages/sdk
        env:
          CI: "true"

      - name: Publish to npm with provenance
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
