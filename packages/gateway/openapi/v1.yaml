openapi: 3.1.0
info:
  title: Nimbus Local HTTP API
  version: 1.0.0
  description: |
    Read-only HTTP surface served by `nimbus serve` on `127.0.0.1`.
    Never exposed to a network outside the loopback interface.
    See https://github.com/nimbus-agent/Nimbus/blob/main/docs/architecture.md
    for the broader IPC story.
  license:
    name: AGPL-3.0
servers:
  - url: http://127.0.0.1:7474
    description: Local Gateway (default port; override with NIMBUS_HTTP_PORT)
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Gateway is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, gateway]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  gateway:
                    type: string

  /v1/items:
    get:
      operationId: listItems
      summary: List indexed items
      parameters:
        - { in: query, name: service, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { in: query, name: type, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
        - { in: query, name: since, required: false, schema: { type: string }, description: "Relative window, e.g. `7d`, `24h`." }
        - { in: query, name: sinceMs, required: false, schema: { type: integer } }
        - { in: query, name: untilMs, required: false, schema: { type: integer } }
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"

  /v1/items/{id}:
    get:
      operationId: getItem
      summary: Fetch one indexed item by id
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Item found (or `data: null`)."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    nullable: true
                    type: object

  /v1/connectors:
    get:
      operationId: listConnectors
      summary: List connector health snapshots
      responses:
        "200":
          description: Array of connector health rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { type: object }
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /v1/people:
    get:
      operationId: listPeople
      summary: List indexed people
      responses:
        "200":
          description: A page of people.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { type: object } }
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /v1/people/{id}:
    get:
      operationId: getPerson
      summary: Fetch one person by id
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Person found (or `data: null`)."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { nullable: true, type: object }

  /v1/audit:
    get:
      operationId: listAuditLog
      summary: Tail the audit log (most recent first)
      parameters:
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Recent audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { type: object } }
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /v1/openapi.json:
    get:
      operationId: getOpenApiSchema
      summary: This document, served as JSON
      responses:
        "200":
          description: The full OpenAPI 3.1 schema rendered as JSON.
          content:
            application/json:
              schema:
                type: object

  /v1/metrics/dora:
    get:
      operationId: getDoraMetrics
      summary: Compute the four DORA metrics for a configured service
      parameters:
        - in: query
          name: service
          required: true
          schema:
            type: string
        - in: query
          name: since
          required: false
          schema:
            type: string
            default: "30d"
          description: "Window: '<N>d' or '<N>h' (1..365)."
      responses:
        "200":
          description: Four-metric envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoraMetricsResult"
        "400":
          description: Bad request (missing/invalid service, malformed since).

  /v1/preflight/deploy:
    get:
      operationId: getDeployPreflight
      summary: Pre-deploy index check for a configured service
      parameters:
        - in: query
          name: service
          required: true
          schema:
            type: string
        - in: query
          name: target_ref
          required: true
          schema:
            type: string
          description: The branch/ref being deployed.
        - in: query
          name: max_findings
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Cap on findings per check.
      responses:
        "200":
          description: Preflight envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployPreflightResult"
        "400":
          description: Bad request (missing/invalid service, target_ref, or max_findings).

components:
  schemas:
    ItemPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { type: object }
        meta:
          type: object
          required: [total, limit, offset]
          properties:
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
    DoraMetricsResult:
      type: object
      required: [service, since_ms, computed_at, metrics]
      properties:
        service: { type: string }
        since_ms: { type: integer }
        computed_at: { type: string, format: date-time }
        metrics:
          type: object
          required: [deployment_frequency, lead_time_for_changes, change_failure_rate, mttr]
          properties:
            deployment_frequency: { $ref: "#/components/schemas/DoraMetricValue" }
            lead_time_for_changes: { $ref: "#/components/schemas/DoraMetricValue" }
            change_failure_rate: { $ref: "#/components/schemas/DoraMetricValue" }
            mttr: { $ref: "#/components/schemas/DoraMetricValue" }
    DoraMetricValue:
      type: object
      required: [value, unit, sample, gap]
      properties:
        value:
          type: number
          nullable: true
        unit:
          type: string
        sample:
          type: integer
        gap:
          nullable: true
          type: string
          enum: [no_pagerduty_mapping, no_repos, no_deployment_data, low_sample, approximate_lead_time]
    DeployPreflightResult:
      type: object
      required: [service, target_ref, computed_at, verdict, checks]
      properties:
        service: { type: string }
        target_ref: { type: string }
        computed_at: { type: string, format: date-time }
        verdict:
          type: string
          enum: [ok, warn]
        checks:
          type: object
          required: [active_p1_incidents, failing_ci_runs, merge_conflicts]
          properties:
            active_p1_incidents:
              $ref: "#/components/schemas/PreflightIncidentCheck"
            failing_ci_runs:
              $ref: "#/components/schemas/PreflightCiCheck"
            merge_conflicts:
              $ref: "#/components/schemas/PreflightPrCheck"
    PreflightIncidentCheck:
      type: object
      required: [count, findings, gap]
      properties:
        count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/IncidentFinding" }
        gap: { $ref: "#/components/schemas/PreflightGap" }
    PreflightCiCheck:
      type: object
      required: [count, findings, gap]
      properties:
        count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/CiFinding" }
        gap: { $ref: "#/components/schemas/PreflightGap" }
    PreflightPrCheck:
      type: object
      required: [count, findings, gap]
      properties:
        count: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/PrFinding" }
        gap: { $ref: "#/components/schemas/PreflightGap" }
    PreflightGap:
      nullable: true
      type: string
      enum: [no_pagerduty_mapping, no_repos, unknown_mergeable_state]
    IncidentFinding:
      type: object
      required: [id, title, status, severity, opened_at_ms, pagerduty_service_id, url]
      properties:
        id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [triggered, acknowledged]
        severity: { type: string }
        opened_at_ms: { type: integer }
        pagerduty_service_id: { type: string }
        url:
          type: string
          nullable: true
    CiFinding:
      type: object
      required: [id, title, conclusion, modified_at_ms, branch, head_sha, url]
      properties:
        id: { type: string }
        title: { type: string }
        conclusion:
          type: string
          enum: [failure, cancelled, timed_out]
        modified_at_ms: { type: integer }
        branch: { type: string }
        head_sha:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    PrFinding:
      type: object
      required: [id, title, number, mergeable_state, modified_at_ms, url]
      properties:
        id: { type: string }
        title: { type: string }
        number: { type: integer }
        mergeable_state: { type: string }
        modified_at_ms: { type: integer }
        url:
          type: string
          nullable: true
