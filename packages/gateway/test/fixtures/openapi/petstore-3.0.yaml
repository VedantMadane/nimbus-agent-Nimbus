openapi: 3.0.0
info:
  title: Petstore API
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      responses:
        "200":
          description: ok
  /pets/{id}:
    delete:
      operationId: deletePet
      deprecated: true
      tags: [pets, admin]
      responses:
        "204":
          description: no content
